<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">Peter Swanson</title><desc id="desc">Peter Swanson. Original topaz motif on a dark background.</desc><defs>
